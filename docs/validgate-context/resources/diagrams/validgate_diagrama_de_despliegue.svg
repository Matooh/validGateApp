<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">VALIDGATE — Diagrama de despliegue para validación académica</title>
  <desc id="desc">Next.js se ejecuta localmente en el PC de demostración y consume Supabase Cloud. Vercel se presenta como evolución futura opcional.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #53627a; }
      .node-title { font-size: 21px; font-weight: 700; }
      .box-title { font-size: 17px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #53627a; }
      .node { fill: #f8fafc; stroke: #475569; stroke-width: 2.4; }
      .local { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
      .cloud { fill: #ecfdf5; stroke: #059669; stroke-width: 3; }
      .component { fill: #ffffff; stroke: #64748b; stroke-width: 1.8; }
      .browser { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1.8; }
      .service { fill: #d1fae5; stroke: #10b981; stroke-width: 1.8; }
      .future { fill: #fffbeb; stroke: #d97706; stroke-width: 2; stroke-dasharray: 9 7; }
      .note { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .optional { fill: none; stroke: #d97706; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrowFuture); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowFuture" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1600" height="950" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="title">VALIDGATE — Diagrama de despliegue</text>
  <text x="800" y="77" text-anchor="middle" class="subtitle">Entorno de validación académica: build de producción local + Supabase Cloud</text>

  <rect x="55" y="120" width="700" height="595" rx="22" class="local"/>
  <text x="85" y="158" class="node-title">&lt;&lt;device&gt;&gt; PC de demostración</text>
  <text x="85" y="184" class="small">Windows · Node.js 22 · acceso por localhost · pantalla compartida</text>

  <rect x="95" y="220" width="620" height="160" rx="16" class="node"/>
  <text x="125" y="253" class="box-title">&lt;&lt;executionEnvironment&gt;&gt; Navegadores web</text>
  <rect x="125" y="280" width="165" height="65" rx="12" class="browser"/>
  <rect x="322" y="280" width="165" height="65" rx="12" class="browser"/>
  <rect x="520" y="280" width="165" height="65" rx="12" class="browser"/>
  <text x="208" y="319" text-anchor="middle" class="box-title">Chrome</text>
  <text x="405" y="319" text-anchor="middle" class="box-title">Edge</text>
  <text x="602" y="319" text-anchor="middle" class="box-title">Firefox</text>

  <rect x="145" y="470" width="520" height="180" rx="16" class="component"/>
  <text x="175" y="510" class="box-title">&lt;&lt;executionEnvironment&gt;&gt; Node.js</text>
  <text x="175" y="543" class="node-title">Next.js Runtime — VALIDGATE</text>
  <text x="175" y="576" class="body">• build optimizada: npm run build</text>
  <text x="175" y="603" class="body">• servidor local: npm start</text>
  <text x="175" y="630" class="body">• Server Components, Server Actions y proxy de sesión</text>

  <path d="M405 380 L405 470" class="arrow"/>
  <text x="422" y="430" class="small">HTTP · localhost:3000</text>

  <rect x="845" y="120" width="700" height="595" rx="22" class="cloud"/>
  <text x="875" y="158" class="node-title">&lt;&lt;node&gt;&gt; Supabase Cloud</text>
  <text x="875" y="184" class="small">Servicios administrados externos · disponibilidad dependiente de Internet</text>

  <rect x="905" y="235" width="580" height="105" rx="15" class="service"/>
  <text x="935" y="275" class="box-title">Supabase Auth</text>
  <text x="935" y="307" class="body">Identidades, login, sesiones y callbacks</text>

  <rect x="905" y="385" width="580" height="105" rx="15" class="service"/>
  <text x="935" y="425" class="box-title">Data API / RPC</text>
  <text x="935" y="457" class="body">Consultas HTTPS y operaciones transaccionales</text>

  <rect x="905" y="535" width="580" height="120" rx="15" class="service"/>
  <text x="935" y="575" class="box-title">PostgreSQL</text>
  <text x="935" y="607" class="body">Persistencia, Row Level Security, triggers y funciones</text>
  <text x="935" y="632" class="small">Esquema versionado en supabase/migrations</text>

  <path d="M665 540 C770 540 790 438 905 438" class="arrow"/>
  <text x="765" y="472" text-anchor="middle" class="small">HTTPS · consultas / RPC</text>
  <path d="M715 300 C805 300 820 287 905 287" class="arrow"/>
  <text x="810" y="276" text-anchor="middle" class="small">HTTPS · Auth desde navegador</text>
  <path d="M1195 490 L1195 535" class="arrow"/>

  <rect x="55" y="765" width="1030" height="130" rx="18" class="note"/>
  <text x="85" y="803" class="box-title">Límite operativo del entorno de validación</text>
  <text x="85" y="835" class="body">La aplicación se ejecuta localmente, pero no funciona offline: Auth y persistencia continúan en Supabase Cloud.</text>
  <text x="85" y="864" class="body">La comisión observa los flujos mediante pantalla compartida; no se requieren túneles ni acceso remoto al localhost.</text>

  <rect x="1140" y="765" width="405" height="130" rx="18" class="future"/>
  <text x="1170" y="803" class="box-title">Evolución productiva futura</text>
  <text x="1170" y="835" class="body">Next.js → Vercel u otra plataforma</text>
  <text x="1170" y="864" class="small">Alternativa opcional, fuera del requisito de defensa</text>
  <path d="M1085 830 L1140 830" class="optional"/>
</svg>
